# Domino 开发环境容器：docker compose -f docker/compose.yaml up -d --build
name: domino

services:
  dev-env:
    build:
      # 镜像只需要 setup-dev.sh，构建上下文限定为 scripts/，不打包源码和构建产物
      context: ../scripts
      dockerfile: ../docker/Dockerfile
    container_name: domino-dev
    ports:
      # SSH端口（用于VSCode远程连接）
      - "10022:22"
      # 游戏服务器端口（可选）
      - "6666:6666"
    volumes:
      # 挂载项目目录到容器
      - ..:/root/domino
    stdin_open: true
    tty: true
